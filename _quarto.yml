project:
  type: book
  execute-dir: project
  output-dir: _output
  resources: [cache/dashboard.json]

book:
  title: "Macro Finance"
  subtitle: "A Living Textbook on International Finance"
  author:
    - name: "Bento J. Lobo, Ph.D., CFA"
      affiliation: "The University of Tennessee at Chattanooga"
  date: last-modified
  date-format: "MMMM D, YYYY"
  search: true
  sidebar: {style: docked, collapse-level: 1}
  page-footer:
    left: "© 2026 Bento J. Lobo, Ph.D., CFA"
    center: "Living edition — data refreshed at build time"
  chapters:
    - index.qmd
    - front/top-ten.qmd
    - contents.qmd
    - part: "Part I — The Global Financial Environment"
      chapters:
        - chapters/01-introduction.qmd

format:
  html:
    theme: [cosmo, theme/macro.scss]
    echo: false            # chart code stays in the repository, not on the page
    code-tools: false
    toc-title: "On this page"
    toc-depth: 3
    include-after-body: theme/indicators.html
    fig-width: 8
    fig-height: 4.5
  pdf:
    documentclass: scrbook
    papersize: letter
    echo: false
    fig-pos: "htbp"

execute:
  freeze: auto
  warning: false
  message: false
