name: Refresh data and publish
on:
  schedule: [{cron: '17 11 * * *'}]   # daily, 11:17 UTC (6:17 am Eastern): news + data
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
jobs:
  render:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # date stamps follow the author's clock, not the server's (UTC)
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Refresh data snapshots
        env: {FRED_API_KEY: "${{ secrets.FRED_API_KEY }}"}
        run: python -c "from pylib.datafeeds import refresh_all; refresh_all()"
      - name: Commit refreshed cache
        run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add cache/
          git diff --staged --quiet || git commit -m "chore: daily data and news refresh"
          git push
      - name: Render the web edition
        run: quarto render --to html
      - uses: quarto-dev/quarto-actions/publish@v2
        with: {target: gh-pages, render: false}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
