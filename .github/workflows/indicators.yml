name: Refresh Today's Indicators
# Macro releases (CPI, PCE, payrolls, claims, policy rates) land on weekday mornings and
# FOMC/ECB afternoons. Check hourly on weekdays; commit only when a value changes.
# The sidebar reads cache/dashboard.json straight from main, so no re-render is needed.
on:
  schedule: [{cron: '7 11-23 * * 1-5'}]   # :07 past each hour, 6am-6pm ET (7am-7pm in summer)
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: data-commits, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install pandas requests
      - run: python -m pylib.dashboard
      - name: Commit if anything changed
        run: |
          git config user.name data-bot
          git config user.email bot@users.noreply.github.com
          git add cache/dashboard.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: indicators refresh"
          git pull --rebase --autostash && git push
